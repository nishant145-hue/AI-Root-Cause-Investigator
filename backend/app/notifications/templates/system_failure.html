<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>System Failure</title>
</head>

<body>
    <div>
        <h1>❌ System Failure</h1>

        <p>
            AI Root Cause Investigator encountered a system failure.
        </p>

        <p>
            <strong>Component:</strong>
            {{ component }}
        </p>

        <p>
            <strong>Error:</strong>
            {{ message }}
        </p>

        {% if timestamp %}
        <p>
            <strong>Time:</strong>
            {{ timestamp }}
        </p>
        {% endif %}
    </div>
</body>
</html>

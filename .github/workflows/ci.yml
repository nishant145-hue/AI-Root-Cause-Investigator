name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rootcause_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d rootcause_db"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify configuration
        env:
          TESTING: "true"
          SECRET_KEY: "ci-test-secret-key"
          DATABASE_URL: "postgresql://postgres:postgres@127.0.0.1:5432/rootcause_db"
          GROQ_API_KEY: "ci-test-groq-key"
        run: |
          python -c "from app.core.config import settings; print('Configuration loaded successfully')"

      - name: Validate Python syntax
        run: |
          python -m compileall -q app

      - name: Check Git whitespace
        working-directory: .
        run: |
          git diff --check

      - name: Check Python dependencies
        run: |
          pip check

      - name: Check Alembic migrations
        env:
          TESTING: "true"
          SECRET_KEY: "ci-test-secret-key"
          DATABASE_URL: "postgresql://postgres:postgres@127.0.0.1:5432/rootcause_db"
          GROQ_API_KEY: "ci-test-groq-key"
        run: |
          alembic check

      - name: Run backend tests
        env:
          TESTING: "true"
          SECRET_KEY: "ci-test-secret-key"
          DATABASE_URL: "postgresql://postgres:postgres@127.0.0.1:5432/rootcause_db"
          GROQ_API_KEY: "ci-test-groq-key"
        run: |
          pytest -q

  docker-build:
    name: Production Docker Build and Smoke Test
    runs-on: ubuntu-latest
    needs: backend-tests

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rootcause_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d rootcause_db"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set Docker image metadata
        id: metadata
        run: |
          echo "image=ai-root-cause-investigator" >> "$GITHUB_OUTPUT"
          echo "sha_tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build production Docker image
        run: |
          docker build \
            -f backend/Dockerfile \
            -t "${{ steps.metadata.outputs.image }}:${{ steps.metadata.outputs.sha_tag }}" \
            backend

      - name: Tag latest image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag \
            "${{ steps.metadata.outputs.image }}:${{ steps.metadata.outputs.sha_tag }}" \
            "${{ steps.metadata.outputs.image }}:latest"

      - name: Verify Docker image
        run: |
          docker image inspect \
            "${{ steps.metadata.outputs.image }}:${{ steps.metadata.outputs.sha_tag }}"

      - name: Verify Docker runtime dependencies
        run: |
          docker run --rm \
            "${{ steps.metadata.outputs.image }}:${{ steps.metadata.outputs.sha_tag }}" \
            python -c "import slowapi, pandas, openpyxl, reportlab, groq, jinja2; print('Docker runtime dependencies: OK')"

      - name: Verify Docker pip dependencies
        run: |
          docker run --rm \
            "${{ steps.metadata.outputs.image }}:${{ steps.metadata.outputs.sha_tag }}" \
            pip check

      - name: Verify Docker application import
        run: |
          docker run --rm \
            -e TESTING=true \
            -e SECRET_KEY=ci-test-secret-key \
            -e DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/rootcause_db \
            -e GROQ_API_KEY=ci-test-groq-key \
            --network host \
            "${{ steps.metadata.outputs.image }}:${{ steps.metadata.outputs.sha_tag }}" \
            python -c "from app.main import app; print('Docker application import: OK')"

      - name: Start production container
        run: |
          docker run -d \
            --name ai-root-cause-investigator-smoke \
            --network host \
            -e TESTING=false \
            -e SECRET_KEY=ci-test-production-secret-key \
            -e DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/rootcause_db \
            -e GROQ_API_KEY=ci-test-groq-key \
            -e PORT=8000 \
            "${{ steps.metadata.outputs.image }}:${{ steps.metadata.outputs.sha_tag }}"

      - name: Wait for container health
        run: |
          for i in {1..30}; do
            status=$(docker inspect \
              --format='{{.State.Health.Status}}' \
              ai-root-cause-investigator-smoke 2>/dev/null || true)

            echo "Health status: ${status}"

            if [ "${status}" = "healthy" ]; then
              exit 0
            fi

            if [ "${status}" = "unhealthy" ]; then
              echo "Container became unhealthy."
              docker logs ai-root-cause-investigator-smoke
              exit 1
            fi

            sleep 2
          done

          echo "Container did not become healthy in time."
          docker logs ai-root-cause-investigator-smoke
          exit 1

      - name: Verify container health
        run: |
          docker inspect \
            --format='Container health: {{.State.Health.Status}}' \
            ai-root-cause-investigator-smoke

      - name: Run production smoke test
        working-directory: backend
        env:
          SMOKE_TEST_BASE_URL: http://localhost:8000
        run: |
          python scripts/production_smoke_test.py

      - name: Verify production endpoints
        run: |
          curl --fail --silent --show-error http://localhost:8000/health
          curl --fail --silent --show-error http://localhost:8000/ready
          curl --fail --silent --show-error http://localhost:8000/
          curl --fail --silent --show-error http://localhost:8000/docs > /dev/null

      - name: Display Docker images
        run: |
          docker images "${{ steps.metadata.outputs.image }}"

      - name: Show production container logs
        if: always()
        run: |
          docker logs ai-root-cause-investigator-smoke || true

      - name: Cleanup production container
        if: always()
        run: |
          docker rm -f ai-root-cause-investigator-smoke || true